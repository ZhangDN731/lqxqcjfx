<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河北尚学单招校区成绩分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c3e50 0%, #4158d0 50%, #c850c0 100%);
            overflow: hidden;
            padding: 20px;
            font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap');

        /* 粒子画布 */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 鼠标跟随光晕 */
        #lightGlow {
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: 0.12s ease;
        }

        /* 毛玻璃主容器 */
        .glass-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 24px;
            padding: 52px 46px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 44px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* 第一行：三个校区横向排列 */
        .campus-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .campus-row .entry-card {
            flex: 1;
            margin-bottom: 0;
        }

        .entry-card {
            display: block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 20px;
            transition: all 0.35s ease;
            text-align: center;
        }

        .entry-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .entry-title {
            color: #fff;
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .entry-desc {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14.5px;
            line-height: 1.6;
            min-height: 36px;
        }

        .footer-tip {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
        }

        /* 小屏幕适配 */
        @media (max-width: 700px) {
            .campus-row {
                flex-direction: column;
            }
            .glass-box {
                padding: 36px 24px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div id="lightGlow"></div>

    <div class="glass-box">
        <h1>河北尚学单招校区成绩分析</h1>

        <!-- 第一行：三个校区 -->
        <div class="campus-row">
            <a href="index-二合一（龙泉校区）.html" class="entry-card">
                <div class="entry-title">龙泉校区成绩分析系统</div>
                <div class="entry-desc">个人+班级成绩的展示</div>
                <div class="entry-desc">9月8日：新增排名展示</div>
            </a>

            <a href="index-二合一（星耀校区）.html" class="entry-card">
                <div class="entry-title">星耀校区成绩分析系统</div>
                <div class="entry-desc">个人+班级成绩的展示</div>
                <div class="entry-desc">不能用，没更新</div>
            </a>

            <a href="index-二合一（睿智校区）.html" class="entry-card">
                <div class="entry-title">睿智校区成绩分析系统</div>
                <div class="entry-desc">个人+班级成绩的展示</div>
                <div class="entry-desc">不能用，没更新</div>
            </a>
        </div>

        <!-- 第二行：个人分析 -->
        <a href="index-个人分析.html" class="entry-card">
            <div class="entry-title">学生个人各科成绩变化</div>
            <div class="entry-desc">用于查看学生个人各科考试成绩变化趋势，追踪分数波动情况</div>
        </a>

        <!-- 第三行：班级分析 -->
        <a href="index-班级分析.html" class="entry-card">
            <div class="entry-title">班级横向成绩对比</div>
            <div class="entry-desc">多班级横向单科目成绩对比，直观展示各班分数差距与排名情况</div>
        </a>

        <div class="footer-tip">
            <div id="currentTime"></div>
            <div>制作者：ZhangD!n@nmnmnmn</div>
        </div>
    </div>

    <script>
        // 实时更新时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').innerText = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 鼠标跟随光效
        const glow = document.getElementById('lightGlow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // 粒子特效
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.radius = Math.random() * 2.2 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.7;
                this.speedY = (Math.random() - 0.5) * 0.7;
                this.opacity = Math.random() * 0.4 + 0.15;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > w) this.speedX *= -1;
                if (this.y < 0 || this.y > h) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.fill();
            }
        }

        for(let i = 0; i < 90; i++){
            particles.push(new Particle());
        }

        function animate(){
            ctx.clearRect(0,0,w,h);
            particles.forEach(p=>{
                p.update();
                p.draw();
            })
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
