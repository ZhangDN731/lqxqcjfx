/* ============================================================
 *  导出 PDF —— 文件名智能拼装
 * ============================================================ */
function sanitizeFileName(s) {
  return String(s == null ? '' : s)
    .replace(/[\\/:*?"<>|\r\n\t]/g, '-')
    .replace(/\s+/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 80);
}
function buildExportFileName() {
  const pageNames = {
    f1:'学生个人分析', f2:'班级趋势对比', f3:'全班成绩明细',
    f4:'全班图表',     f5:'数据明细表',   f6:'达标率'
  };
  const subNames = {
    f1a:'个人趋势', f1b:'名次变化', f1c:'稳定性分析',
    f2a:'班级整体', f2b:'三分对比', f2c:'单科成绩',
    f3a:'全班成绩', f3b:'单科进步榜',
    f4a:'全班图表', f4b:'分数段分布'
  };
  const page = state.currentPage;
  const parts = ['星耀校区'];

  const collectChecked = wrapId => {
    const el = $(wrapId);
    if (!el) return [];
    return Array.from(el.querySelectorAll('input[type="checkbox"]:checked')).map(i => i.value);
  };
  let clsList = [];
  if (page === 'f2' && state.currentSub.f2 === 'f2b') clsList = collectChecked('tripleClassWrap');
  else if (page === 'f2' && state.currentSub.f2 === 'f2c') clsList = collectChecked('subClassWrap');
  else if (page === 'f4' && state.currentSub.f4 === 'f4b') clsList = collectChecked('segClassWrap');
  else if (page === 'f5') clsList = collectChecked('tableClassWrap');
  else if (page === 'f6') clsList = collectChecked('rateClassWrap');
  else if (state.currentClass) clsList = [state.currentClass];

  if (clsList.length === 0) {
    parts.push('未选班级');
  } else if (clsList.length <= 2) {
    parts.push(clsList.join('+'));
  } else {
    parts.push('共' + clsList.length + '个班级');
  }

  if (pageNames[page]) parts.push(pageNames[page]);

  const subKey = state.currentSub[page];
  if (subKey && subNames[subKey] && subNames[subKey] !== pageNames[page]) {
    parts.push(subNames[subKey]);
  }

  const exams = state.examList;
  if (exams.length === 1) {
    parts.push(exams[0]);
  } else if (exams.length > 1) {
    if (exams.length <= 2) parts.push(exams.join('+'));
    else parts.push(exams[exams.length - 1] + '等' + exams.length + '次');
  }

  const now = new Date();
  const p2 = n => String(n).padStart(2, '0');
  parts.push(
    now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate()) +
    '_' + p2(now.getHours()) + p2(now.getMinutes())
  );

  const name = parts.filter(Boolean).map(sanitizeFileName).filter(Boolean).join('_');
  return (name || '星耀校区_成绩分析') + '.pdf';
}

async function exportReport() {
  if (!hasData()) { alert('暂无数据'); return; }
  const btn = $('exportBtn');
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '导出中...';
  try {
    const { jsPDF } = window.jspdf;
    const el = document.querySelector('.container');
    const canvas = await html2canvas(el, {scale:1.2,backgroundColor:'#ffffff',useCORS:true});
    const pdf = new jsPDF('p','mm','a4');
    const imgW = 210, pageH = 297;
    const imgH = canvas.height * imgW / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    let heightLeft = imgH, position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    const fileName = buildExportFileName();
    pdf.save(fileName);
  } catch (e) {
    console.error(e);
    alert('PDF 导出失败，可使用浏览器打印另存为 PDF');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

<script>
/* ===== 光子粒子背景动画 ===== */
(function () {
  const canvas = document.getElementById('particleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
  }
  function initParticles() {
    particles = [];
    const count = Math.min(Math.floor((canvas.width * canvas.height) / 14000), 110);
    for (let i = 0; i < count; i++) particles.push(createParticle());
  }
  function createParticle() {
    return {
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      size:Math.random()*2.6+0.5,
      speedX:(Math.random()-0.5)*0.45, speedY:(Math.random()-0.5)*0.45,
      opacity:Math.random()*0.45+0.12,
      hue:Math.random()*40+200,
      saturation:Math.random()*50+50,
      lightness:Math.random()*30+50,
      pulse:Math.random()*Math.PI*2
    };
  }
  function drawParticle(p) {
    p.pulse += 0.02;
    const op = p.opacity * (0.7 + Math.sin(p.pulse) * 0.3);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + op + ')';
    ctx.fill();
    if (p.size > 1.5) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + (op * 0.15) + ')';
      ctx.fill();
    }
  }
  function connectParticles() {
    const maxDist = 145;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(59,130,246,' + ((1 - dist / maxDist) * 0.15) + ')';
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.speedX; p.y += p.speedY;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      drawParticle(p);
    });
    connectParticles();
    requestAnimationFrame(animate);
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  resize();
  animate();
})();
</script>
