<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星耀校区成绩分析系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-darker:#1d4ed8;
  --text-main:#1a1a2e;--text-sub:#334155;--text-muted:#64748b;
  --up:#22c55e;--down:#ef4444;
  --card-bg:#ffffff;--card-border:rgba(59,130,246,.16);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-main);
  background:linear-gradient(135deg,#e8f0fe 0%,#f0f4ff 25%,#e0ecf8 50%,#f5f8fc 75%,#e8f0fe 100%);
  background-attachment:fixed;min-height:100vh;line-height:1.6;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
#particleCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.28}

.topbar{position:sticky;top:0;z-index:100;background:#ffffff;border-bottom:1px solid rgba(59,130,246,.18);box-shadow:0 4px 20px rgba(59,130,246,.08)}
.topbar-inner{max-width:1800px;margin:0 auto;padding:0 24px}
.topbar-main{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px 0}
.topbar-main h1{font-size:1.22rem;font-weight:800;color:var(--primary-darker);letter-spacing:-.5px;white-space:nowrap;display:flex;align-items:center;gap:9px;margin:0}
.topbar-main h1::before{content:'';display:inline-block;width:6px;height:22px;border-radius:3px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);flex:0 0 auto}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topbar-settings{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 0 12px;border-top:1px dashed rgba(59,130,246,.16)}
.setting-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setting-group-title{font-size:.74rem;font-weight:800;color:var(--primary-dark);letter-spacing:1.2px;padding:2px 9px;border-radius:6px;background:rgba(59,130,246,.1);white-space:nowrap;flex:0 0 auto}
.setting-group.rate .setting-group-title{color:#15803d;background:rgba(34,197,94,.12)}
.setting-fields{display:flex;gap:6px;flex-wrap:wrap}
.setting-divider{width:1px;height:22px;background:rgba(59,130,246,.25);flex:0 0 auto}
.line-setting{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:#f8fbff;border:1px solid var(--card-border);font-size:.78rem}
.line-setting:hover{border-color:rgba(59,130,246,.4)}
.line-setting:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.line-setting .setting-label{font-weight:600;color:var(--text-muted);white-space:nowrap;font-size:.76rem}
.line-setting input{width:46px;padding:2px 4px;border:none;outline:none;background:transparent;font-size:.83rem;font-weight:800;color:var(--primary-darker);text-align:center;font-family:inherit;-moz-appearance:textfield}
.line-setting input::-webkit-outer-spin-button,.line-setting input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.line-setting .unit{font-size:.72rem;color:var(--text-muted);font-weight:700}
.line-setting.rate-setting{background:#f0fdf4;border-color:rgba(34,197,94,.25)}
.line-setting.rate-setting:hover{border-color:rgba(34,197,94,.5)}
.line-setting.rate-setting input{color:#15803d}

.btn{padding:7px 14px;border-radius:10px;font-size:.85rem;font-weight:600;border:1px solid rgba(59,130,246,.25);background:#ffffff;color:#1e3a5f;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
.btn:hover{border-color:var(--primary);color:var(--primary-dark);background:#eff6ff;box-shadow:0 4px 14px rgba(59,130,246,.2)}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(59,130,246,.3)}
.btn-primary:hover{color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(34,197,94,.25)}
.btn-success:hover{color:#fff;background:linear-gradient(135deg,#16a34a,#15803d)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-mini{padding:3px 10px;font-size:.75rem;border-radius:7px;border:1px solid rgba(59,130,246,.25);background:#fff;color:var(--primary-dark);cursor:pointer;font-weight:600;transition:all .18s;font-family:inherit}
.btn-mini:hover{background:rgba(59,130,246,.1);border-color:var(--primary)}

.container{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:18px 24px 40px}

.status-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#ffffff;border:1px solid var(--card-border);border-radius:var(--radius);padding:10px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(59,130,246,.06)}
.status-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-label{font-weight:600;font-size:.85rem;color:var(--text-sub)}
.class-tags{display:flex;gap:6px;flex-wrap:wrap}
.class-tag{padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:600;background:#dbeafe;color:var(--primary-darker);border:1px solid rgba(59,130,246,.25)}
.status-select{padding:6px 12px;border:1px solid rgba(59,130,246,.25);border-radius:9px;background:#fff;font-size:.85rem;color:var(--text-main);cursor:pointer;font-family:inherit}
.status-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

.main-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;margin-bottom:16px;background:#ffffff;border:1px solid var(--card-border);border-radius:14px;box-shadow:0 2px 12px rgba(59,130,246,.06)}
.main-tab{padding:8px 18px;border:none;border-radius:9px;background:transparent;color:var(--text-sub);font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.main-tab:hover{background:#eff6ff;color:var(--primary-dark)}
.main-tab.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3)}

.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;margin-bottom:14px;background:#f8fbff;border:1px solid var(--card-border);border-radius:12px;width:fit-content}
.sub-tab{padding:6px 14px;border:none;border-radius:7px;background:transparent;color:var(--text-sub);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.sub-tab:hover{background:#dbeafe;color:var(--primary-dark)}
.sub-tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.3)}

.card{background:#ffffff;border:1px solid var(--card-border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(59,130,246,.06)}
.card h3{font-size:1.02rem;margin-bottom:12px;color:var(--primary-darker)}
.card h4{font-size:.95rem;margin-bottom:10px;color:var(--primary-darker)}

.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.chart-grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.chart-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.chart-card{background:#ffffff;border:1px solid var(--card-border);border-radius:12px;padding:12px;min-width:0;box-shadow:0 2px 10px rgba(59,130,246,.05)}
.chart-card:hover{box-shadow:0 6px 20px rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)}
.chart-card h4{text-align:center;font-size:.9rem;font-weight:700;color:var(--primary-darker);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-box{position:relative;width:100%;height:clamp(240px,32vh,400px);min-width:0}
.chart-grid-5 .chart-box{height:clamp(180px,24vh,280px)}
.chart-grid-2 .chart-box{height:clamp(260px,36vh,420px)}

.big-chart-wrap{position:relative;width:100%;height:clamp(560px,78vh,960px);margin-top:16px;background:#ffffff;border:1px solid var(--card-border);border-radius:14px;padding:22px}
.big-chart-wrap canvas{width:100%!important;height:100%!important;display:block}
.chart-empty-overlay{position:absolute;inset:16px;display:flex;align-items:center;justify-content:center;background:#ffffff;color:var(--text-muted);font-size:.92rem;font-weight:600;border-radius:10px;text-align:center;padding:16px;pointer-events:none}
.triple-chart-card .chart-box{height:clamp(280px,40vh,460px)}

.analysis-panel{margin-bottom:18px;padding:20px 22px;border-radius:16px;background:#eff6ff;border:1px solid rgba(59,130,246,.2);box-shadow:0 6px 22px rgba(59,130,246,.08)}
.analysis-panel-title{font-size:1.04rem;font-weight:800;color:var(--primary-darker);margin-bottom:16px;display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:2px dashed rgba(59,130,246,.24)}
.analysis-panel-title::before{content:'';display:inline-block;width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.analysis-panel-title .tip{font-size:.72rem;font-weight:600;color:#94a3b8;letter-spacing:.5px;margin-left:auto}
.analysis-section{margin-bottom:16px}
.analysis-section:last-child{margin-bottom:0}
.analysis-section-title{font-size:.9rem;font-weight:800;color:var(--primary-dark);margin-bottom:10px;padding-left:12px;position:relative}
.analysis-section-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,#60a5fa,#2563eb)}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:12px}
.analysis-metric{padding:10px 12px;border-radius:11px;background:#ffffff;border:1px solid rgba(59,130,246,.14);text-align:center;min-width:0;box-shadow:0 1px 4px rgba(59,130,246,.05)}
.analysis-metric.has-info{cursor:help}
.analysis-metric.has-info:hover{border-color:rgba(59,130,246,.4);box-shadow:0 4px 12px rgba(59,130,246,.15)}
.analysis-metric-label{font-size:.71rem;color:var(--text-muted);font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.analysis-metric-value{font-size:1.05rem;font-weight:800;color:var(--primary-darker);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.analysis-metric-value.font-up{color:var(--up)}
.analysis-metric-value.font-down{color:var(--down)}
.analysis-metric-value.font-flat{color:var(--text-muted)}

.analysis-text p{font-size:.86rem;color:var(--text-sub);line-height:1.95;padding-left:16px;position:relative;margin-bottom:5px}
.analysis-text p:last-child{margin-bottom:0}
.analysis-text p::before{content:'';position:absolute;left:2px;top:.82em;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);opacity:.65}
.analysis-text b{color:var(--primary-darker)}
.analysis-text b.font-up{color:var(--up)}
.analysis-text b.font-down{color:var(--down)}
.analysis-text b.hl{display:inline-block;padding:0 6px;border-radius:5px;background:#dbeafe;color:var(--primary-darker);font-weight:800;line-height:1.5}
.analysis-text b.warn{display:inline-block;padding:0 6px;border-radius:5px;background:#fee2e2;color:#b91c1c;font-weight:800;line-height:1.5}

.absent-list{margin-top:6px;padding:10px 12px;border-radius:10px;background:#fef2f2;border:1px dashed rgba(239,68,68,.4);font-size:.83rem;color:#7f1d1d;line-height:1.85}
.absent-list .label{font-weight:800;color:#b91c1c;margin-right:6px;display:inline-block}
.absent-list .name-chip{display:inline-block;padding:1px 9px;margin:2px 3px 2px 0;border-radius:99px;background:#ffffff;color:#b91c1c;font-weight:700;border:1px solid rgba(239,68,68,.3);font-size:.78rem}

.filter-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(59,130,246,.12)}
.filter-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-group>label{font-size:.85rem;font-weight:600;color:var(--text-sub);white-space:nowrap}
.filter-group select,.filter-group input{padding:6px 12px;border:1px solid rgba(59,130,246,.25);border-radius:9px;background:#fff;font-size:.85rem;color:var(--text-main);cursor:pointer;font-family:inherit;min-width:110px}
.filter-group select:focus,.filter-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

.filter-block{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(59,130,246,.14)}
.filter-block:last-child{border-bottom:none}
.filter-block-label{flex:0 0 auto;font-size:.85rem;font-weight:700;color:var(--text-sub);padding-top:5px;white-space:nowrap;min-width:44px}
.filter-block-body{flex:1 1 auto;min-width:0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;min-width:0}
.checkbox-item{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;border:1.5px solid rgba(59,130,246,.28);background:#fff;color:var(--text-sub);font-size:.81rem;font-weight:600;cursor:pointer;transition:all .18s;user-select:none;white-space:nowrap}
.checkbox-item:hover{border-color:var(--primary);background:#eff6ff}
.checkbox-item.checked{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(59,130,246,.3)}
.checkbox-item input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.checkbox-item::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;flex:0 0 auto}
.checkbox-item.checked::before{opacity:1;background:#fff}
.group-actions{display:flex;gap:6px;flex:0 0 auto;padding-top:1px}

/* ============================================================
 *  ★★★ 表格：原生 table + table-layout:fixed ★★★
 *  ★★★ 纵向不分页：容器高度由内容撑开，页面整体滚动 ★★★
 * ============================================================ */
.grid-table-scroll{
  overflow-x:auto;
  overflow-y:visible;
  margin-top:4px;
  border-radius:12px;
  border:1px solid var(--card-border);
  background:#ffffff;
  -webkit-overflow-scrolling:touch;
  position:relative;
}

table.data-table{
  table-layout:fixed;
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  font-variant-numeric:tabular-nums;
}

table.data-table th,
table.data-table td{
  box-sizing:border-box;
  height:42px;
  padding:2px 10px;
  text-align:center;
  vertical-align:middle;
  font-size:.84rem;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-right:1px solid rgba(59,130,246,.14);
  border-bottom:1px solid rgba(59,130,246,.14);
  background:#ffffff;
}
table.data-table th:last-child,
table.data-table td:last-child{border-right:none}

table.data-table thead th{
  position:relative;
  z-index:3;
  height:46px;
  padding:2px 8px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#ffffff;
  font-weight:700;
  font-size:.85rem;
  letter-spacing:.2px;
  border-right:1px solid rgba(255,255,255,.18);
  border-bottom:1px solid rgba(255,255,255,.28);
}
table.data-table thead th.sortable{cursor:pointer;user-select:none}
table.data-table thead th.sortable::after{
  content:'⇅';
  display:inline-block;
  margin-left:5px;
  font-size:.7rem;
  opacity:.6;
  vertical-align:1px;
}
table.data-table thead th.sortable:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
table.data-table thead th.sort-asc::after{content:'▲';opacity:1}
table.data-table thead th.sort-desc::after{content:'▼';opacity:1}

table.data-table th.sticky-col,
table.data-table td.sticky-col{
  position:sticky;
  z-index:2;
  box-shadow:6px 0 8px -6px rgba(15,23,42,.16);
}
table.data-table thead th.sticky-col{z-index:4}

table.data-table tbody tr:nth-child(even) td{background:#f5f9ff}
table.data-table tbody tr:hover td{background:#e0efff}

table.data-table td.cell-subject{font-weight:700;background:#eff6ff!important}
table.data-table td.cell-class{font-weight:700;background:#f1f5f9!important}
table.data-table td.cell-streak-up{background:#dcfce7!important}
table.data-table td.cell-streak-down{background:#fee2e2!important}

table.data-table td.grid-empty{
  height:110px;
  color:#94a3b8;
  font-size:.9rem;
  background:#ffffff!important;
  border-right:none;
}

.score-main{display:block;font-size:.9rem;font-weight:700;line-height:1.25;color:var(--text-main)}
.score-diff{display:inline-block;font-size:.7rem;font-weight:600;line-height:1.2;margin:0 2px;vertical-align:middle}
.diff-up{color:var(--up)}.diff-down{color:var(--down)}.diff-flat{color:var(--text-muted)}
.font-up{color:var(--up);font-weight:700}
.font-down{color:var(--down);font-weight:700}
.font-flat{color:var(--text-muted)}
.text-green{color:var(--up);font-weight:700}
.text-red{color:var(--down);font-weight:700}
.text-warn{color:#f59e0b;font-weight:700}

.rate-cell{font-weight:800;font-size:.9rem}
.rate-good{color:#16a34a}
.rate-mid{color:#f59e0b}
.rate-low{color:#dc2626}
.rate-delta{font-weight:700;font-size:.82rem;display:inline-block;padding:1px 6px;border-radius:5px;line-height:1.4}
.rate-delta.up{color:#16a34a;background:#dcfce7}
.rate-delta.down{color:#dc2626;background:#fee2e2}
.rate-delta.flat{color:#64748b;background:#f1f5f9}
.fullmark-changed{color:#f59e0b;font-weight:700;font-size:.78rem}

.count-cell{cursor:help;display:inline-block;padding:2px 6px;border-radius:5px;font-weight:700;transition:all .15s}
.count-cell:hover{background:#dbeafe;color:var(--primary-darker)}

.seg-badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:700}
.seg-s{background:#dcfce7;color:#166534}
.seg-a{background:#dbeafe;color:#1e40af}
.seg-b{background:#e0e7ff;color:#3730a3}
.seg-c{background:#fef3c7;color:#92400e}
.seg-d{background:#fee2e2;color:#991b1b}

.rank-up{color:#16a34a;font-weight:700}
.rank-down{color:#dc2626;font-weight:700}
.rank-flat{color:#64748b;font-weight:600}
.rank-new{color:#8b5cf6;font-weight:700}
.stability-good{color:#16a34a;font-weight:700}
.stability-mid{color:#f59e0b;font-weight:700}
.stability-poor{color:#dc2626;font-weight:700}

.stu-row-card{padding:16px;border:1px solid var(--card-border);border-radius:14px;background:#ffffff;margin-bottom:16px;box-shadow:0 2px 12px rgba(59,130,246,.05)}
.stu-row-header{font-weight:800;font-size:1rem;color:var(--primary-darker);margin-bottom:12px;padding-left:10px;border-left:4px solid var(--primary);line-height:1.2}

.empty-hint{text-align:center;padding:60px 10px;color:#94a3b8;font-size:.9rem}
.info-text{font-size:.8rem;color:var(--text-muted)}
.hidden{display:none!important}
.page-title{font-size:1.02rem;font-weight:800;color:var(--primary-darker);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.page-title::before{content:'';display:inline-block;width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#3b82f6,#1d4ed8)}

.hover-tip{position:fixed;z-index:9999;max-width:340px;max-height:60vh;overflow-y:auto;background:#1e3a5f;color:#fff;border-radius:10px;padding:10px 12px;font-size:.8rem;line-height:1.7;box-shadow:0 8px 28px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .15s;font-family:inherit}
.hover-tip.show{opacity:1}
.hover-tip-title{font-weight:800;font-size:.83rem;padding-bottom:5px;margin-bottom:6px;border-bottom:1px dashed rgba(255,255,255,.25);color:#93c5fd}
.hover-tip-item{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:.78rem}
.hover-tip-item .nm{color:#fff;font-weight:600}
.hover-tip-item .val{color:#93c5fd;font-weight:700;font-size:.76rem}
.hover-tip-item.good .val{color:#86efac}
.hover-tip-item.bad .val{color:#fca5a5}
.hover-tip-empty{color:#94a3b8;font-style:italic;font-size:.76rem}

<body>
<canvas id="particleCanvas"></canvas>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">正在处理文件...</div>
</div>

<div class="hover-tip" id="hoverTip"></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-main">
      <h1>星耀校区成绩分析系统</h1>
      <div class="topbar-actions">
        <button class="btn" onclick="downloadTemplate()">下载模板</button>
        <button class="btn btn-primary" id="uploadBtn" onclick="document.getElementById('fileInput').click()">上传 Excel</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" multiple style="display:none">
        <button class="btn btn-success" id="exportBtn" onclick="exportReport()" disabled>导出报告</button>
      </div>
    </div>
    <div class="topbar-settings">
      <div class="setting-group">
        <span class="setting-group-title">分数线</span>
        <div class="setting-fields">
          <div class="line-setting"><span class="setting-label">控分</span><input type="number" id="lineControl" value="0"></div>
          <div class="line-setting"><span class="setting-label">公办</span><input type="number" id="linePublic" value="200"></div>
          <div class="line-setting"><span class="setting-label">民办</span><input type="number" id="linePrivate" value="200"></div>
          <div class="line-setting"><span class="setting-label">预估</span><input type="number" id="lineEstimate" value="0"></div>
        </div>
      </div>
      <div class="setting-divider"></div>
      <div class="setting-group rate">
        <span class="setting-group-title">达标率</span>
        <div class="setting-fields">
          <div class="line-setting rate-setting"><span class="setting-label">最低</span><input type="number" id="rateMin" value="60" min="0" max="100"><span class="unit">%</span></div>
          <div class="line-setting rate-setting"><span class="setting-label">标准</span><input type="number" id="rateStd" value="80" min="0" max="100"><span class="unit">%</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="status-bar" id="statusBar" style="display:none">
    <div class="status-left">
      <span class="status-label">已加载班级：</span>
      <div id="classTagWrap" class="class-tags"></div>
    </div>
    <div class="status-left">
      <label class="status-label" for="classSelect">当前班级：</label>
      <select id="classSelect" class="status-select"></select>
    </div>
  </div>

  <div class="main-tabs" id="mainTabs">
    <button class="main-tab" data-page="f1">学生个人分析</button>
    <button class="main-tab" data-page="f2">班级趋势对比</button>
    <button class="main-tab" data-page="f3">全班成绩明细</button>
    <button class="main-tab" data-page="f4">全班图表</button>
    <button class="main-tab" data-page="f5">数据明细表</button>
    <button class="main-tab" data-page="f6">达标率</button>
  </div>

  <div id="contentArea"></div>
</div>

<script>
/* =====================================================================
 *  星耀校区成绩分析系统 v2.3.0
 *  · 表格使用原生 table + table-layout:fixed，彻底解决错位
 *  · 表格纵向不分页：容器高度由内容撑开，整页滚动
 *  · 班级 / 科目 默认均不选中，需用户自行勾选
 *  · 科目变化自动勾选有该科目数据的班级；班级变化自动勾选有该班级数据的科目
 *  · 导出 PDF 文件名智能拼装
 * ===================================================================== */

const state = {
  classList: [], examList: [], subjectList: [], classes: {},
  currentClass: '',
  currentPage: '',
  currentSub: { f1:'f1a', f2:'f2a', f3:'f3a', f4:'f4a' }
};
let chartInstances = [];
const statCache = new Map();
let filterTimer = null;
let p4Observer = null;
let _uid = 0;
const classSubCache = new Map();

const sortState = {
  classTable:{col:-1,asc:true}, rank:{col:-1,asc:true}, stability:{col:-1,asc:true},
  progress:{col:-1,asc:true}, seg:{col:-1,asc:true}, rate:{col:-1,asc:true}, detail:{col:-1,asc:true}
};

const $ = id => document.getElementById(id);
const uid = () => 'cv' + (++_uid);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

const SUBJECT_FULLMARK_RE = /[（(][^)）]*?(\d+(?:\.\d+)?)[^)）]*[)）]\s*$/;
const extractFullMark = orig => {
  const m = String(orig || '').match(SUBJECT_FULLMARK_RE);
  if (!m) return null;
  const n = parseFloat(m[1]);
  return Number.isNaN(n) || n <= 0 ? null : n;
};
const normalizeSubjectKey = orig => {
  const s = String(orig || '').trim();
  if (!s) return s;
  const base = s.replace(SUBJECT_FULLMARK_RE, '').trim();
  return base || s;
};
const isTotal = s => { const c = normalizeSubjectKey(s); return c === '总分' || c === '总 分' || c === '总成绩'; };
const modeLabel = m => ({ avg:'平均分', max:'最高分', min:'最低分' }[m] || m);

const subjectFullMarks = new Map();
const subjectOriginals = new Map();
const classExamSubjectMark = new Map();

function recordClassSubjectMark(cls, exam, baseKey, origSubject) {
  const fm = extractFullMark(origSubject);
  if (fm == null) return;
  if (!classExamSubjectMark.has(cls)) classExamSubjectMark.set(cls, new Map());
  const em = classExamSubjectMark.get(cls);
  if (!em.has(exam)) em.set(exam, new Map());
  const sm = em.get(exam);
  const cur = sm.get(baseKey) || 0;
  if (fm > cur) sm.set(baseKey, fm);
}
const getClassSubjectMark = (cls, exam, baseKey) => {
  const em = classExamSubjectMark.get(cls);
  if (!em) return null;
  const sm = em.get(exam);
  if (!sm) return null;
  const v = sm.get(baseKey);
  return v == null ? null : v;
};
const getSubjectFullMark = b => { const s = subjectFullMarks.get(b); return s && s.size ? Math.max(...s) : null; };
const getSubjectFullMarkList = b => { const s = subjectFullMarks.get(b); return s ? [...s].sort((a,b)=>a-b) : []; };
const getSubjectOriginalNames = b => { const s = subjectOriginals.get(b); return s ? [...s] : []; };

const toNum = v => { if (v === null || v === undefined || v === '') return null; const n = parseFloat(v); return Number.isNaN(n) ? null : n; };
const readLine = id => { const v = parseFloat($(id).value); return Number.isNaN(v) ? null : v; };
const showLoading = t => { $('loadingText').textContent = t || '正在处理...'; $('loadingOverlay').classList.add('show'); };
const hideLoading = () => $('loadingOverlay').classList.remove('show');
const fmtDelta = d => { if (d == null) return '-'; const v = Math.round(d*10)/10; return v>0 ? '+'+v : String(v); };
const pct = n => (n*100).toFixed(1) + '%';
const getRateMin = () => { const v = parseFloat($('rateMin').value); return (Number.isNaN(v)||v<0||v>100) ? 0.6 : v/100; };
const getRateStd = () => { const v = parseFloat($('rateStd').value); return (Number.isNaN(v)||v<0||v>100) ? 0.8 : v/100; };
const updateRateTips = () => {
  const mn = $('rateMinTip'), st = $('rateStdTip');
  if (mn) mn.textContent = Math.round(getRateMin()*100);
  if (st) st.textContent = Math.round(getRateStd()*100);
};

/* ============ 悬浮提示 ============ */
function attachHover(el, title, items) {
  if (!el) return;
  el.addEventListener('mouseenter', e => {
    const tip = $('hoverTip');
    let html = '<div class="hover-tip-title">' + esc(title) + '</div>';
    if (!items || !items.length) html += '<div class="hover-tip-empty">无相关数据</div>';
    else items.forEach(it => {
      let cls = 'hover-tip-item';
      if (it.tone === 'good') cls += ' good';
      else if (it.tone === 'bad') cls += ' bad';
      html += '<div class="' + cls + '"><span class="nm">' + esc(it.name) + '</span><span class="val">' + (it.value != null ? esc(it.value) : '') + '</span></div>';
    });
    tip.innerHTML = html;
    tip.classList.add('show');
    positionTip(e);
  });
  el.addEventListener('mousemove', positionTip);
  el.addEventListener('mouseleave', () => $('hoverTip').classList.remove('show'));
}
function positionTip(e) {
  const tip = $('hoverTip');
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const rect = tip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - pad;
  tip.style.left = Math.max(6, x) + 'px';
  tip.style.top = Math.max(6, y) + 'px';
}
function bindHoverTips() {
  document.querySelectorAll('[data-tip-title]').forEach(el => {
    if (el.dataset.tipBound) return;
    el.dataset.tipBound = '1';
    let items = [];
    try { items = JSON.parse(el.dataset.tipItems || '[]'); } catch (e) {}
    attachHover(el, el.dataset.tipTitle, items);
  });
}

/* ============================================================
 *  ★★★ 自动联动核心 ★★★
 *  科目变化 → 自动勾选有该科目数据的班级
 *  班级变化 → 自动勾选有该班级数据的科目
 * ============================================================ */
function classHasSubjectData(cls, sub, exam) {
  const students = state.classes[cls]?.students;
  if (!students) return false;
  if (exam) {
    for (const name in students) {
      if (typeof students[name]?.[exam]?.[sub] === 'number') return true;
    }
    return false;
  }
  const exams = state.examList;
  for (const name in students) {
    for (const ex of exams) {
      if (typeof students[name]?.[ex]?.[sub] === 'number') return true;
    }
  }
  return false;
}

function autoSelectBySubjects(subjectWrapId, classWrapId, exam) {
  const selSubs = getChecked(subjectWrapId);
  const wrap = $(classWrapId);
  if (!wrap) return;
  wrap.querySelectorAll('.checkbox-item').forEach(item => {
    const inp = item.querySelector('input[type="checkbox"]');
    if (!inp) return;
    const cls = inp.value;
    const has = selSubs.length > 0 && selSubs.some(sub => classHasSubjectData(cls, sub, exam));
    inp.checked = has;
    item.classList.toggle('checked', has);
  });
}

function autoSelectByClasses(classWrapId, subjectWrapId, exam) {
  const selClasses = getChecked(classWrapId);
  const wrap = $(subjectWrapId);
  if (!wrap) return;
  wrap.querySelectorAll('.checkbox-item').forEach(item => {
    const inp = item.querySelector('input[type="checkbox"]');
    if (!inp) return;
    const sub = inp.value;
    const has = selClasses.length > 0 && selClasses.some(cls => classHasSubjectData(cls, sub, exam));
    inp.checked = has;
    item.classList.toggle('checked', has);
  });
}

/* ============================================================
 *  ★★★ 表格：原生 table + colgroup 固定列宽 ★★★
 * ============================================================ */
function renderGridTable(cols, rows, sortKey, wrapEl, onSort) {
  const st = sortState[sortKey] || (sortState[sortKey] = { col: -1, asc: true });

  let sortedRows = rows.slice();
  if (st.col >= 0) {
    const col = cols[st.col];
    if (col && col.getValue) {
      sortedRows.sort((a, b) => {
        const va = col.getValue(a), vb = col.getValue(b);
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'string' || typeof vb === 'string') {
          const cmp = String(va).localeCompare(String(vb), 'zh');
          return st.asc ? cmp : -cmp;
        }
        return st.asc ? va - vb : vb - va;
      });
    }
  }

  let leftOffset = 0;
  const stickyLeft = cols.map(c => {
    if (c.sticky) { const v = leftOffset; leftOffset += c.width; return v; }
    return null;
  });

  const totalWidth = cols.reduce((sum, c) => sum + (c.width || 100), 0);

  function parseCell(html) {
    if (html == null) return { content: '', cls: '' };
    const s = String(html);
    const m = s.match(/^<td([^>]*)>([\s\S]*)<\/td>$/);
    if (!m) return { content: s, cls: '' };
    const clsMatch = m[1].match(/class="([^"]*)"/);
    return { content: m[2], cls: clsMatch ? clsMatch[1] : '' };
  }

  let html = '<div class="grid-table-scroll">';
  html += '<table class="data-table" style="min-width:' + totalWidth + 'px">';
  html += '<colgroup>' + cols.map(c => '<col style="width:' + (c.width || 100) + 'px">').join('') + '</colgroup>';

  html += '<thead><tr>';
  cols.forEach((c, i) => {
    const cls = [];
    if (c.sortable !== false) cls.push('sortable');
    if (st.col === i) cls.push(st.asc ? 'sort-asc' : 'sort-desc');
    if (c.sticky) cls.push('sticky-col');
    const styleAttr = c.sticky ? ' style="left:' + stickyLeft[i] + 'px"' : '';
    html += '<th class="' + cls.join(' ') + '" data-col="' + i + '"' + styleAttr + '>' + (c.label || '') + '</th>';
  });
  html += '</tr></thead><tbody>';

  if (!sortedRows.length) {
    html += '<tr><td class="grid-empty" colspan="' + cols.length + '">无数据</td></tr>';
  } else {
    sortedRows.forEach((row, ri) => {
      html += '<tr>';
      cols.forEach((c, ci) => {
        const parsed = c.render ? parseCell(c.render(row, ri)) : { content: '', cls: '' };
        const cls = [];
        if (c.sticky) cls.push('sticky-col');
        if (parsed.cls) cls.push(parsed.cls);
        const styleAttr = c.sticky ? ' style="left:' + stickyLeft[ci] + 'px"' : '';
        html += '<td class="' + cls.join(' ') + '"' + styleAttr + '>' + parsed.content + '</td>';
      });
      html += '</tr>';
    });
  }

  html += '</tbody></table></div>';
  wrapEl.innerHTML = html;

  wrapEl.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const idx = parseInt(th.dataset.col, 10);
      if (st.col === idx) st.asc = !st.asc;
      else { st.col = idx; st.asc = true; }
      onSort();
    });
  });

  setTimeout(bindHoverTips, 10);
}

/* ============ 数据解析 ============ */
function parseSheet(rows, className) {
  if (!rows || rows.length < 3) return;
  const row0 = rows[0] || [], row1 = rows[1] || [];
  const h00 = String(row0[0] ?? '').trim();
  const h01 = String(row1[0] ?? '').trim();
  if (h00 === '学生' && h01 === '考试') parseVertical(rows, className);
  else parseHorizontal(rows, className);
}
function parseVertical(rows, className) {
  const headers = (rows[0] || []).map(h => String(h ?? '').trim());
  const rawSubjects = headers.slice(2).filter(Boolean);
  if (!rawSubjects.length) return;
  rawSubjects.forEach(registerSubject);
  const baseKeys = rawSubjects.map(normalizeSubjectKey);
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length < 3) continue;
    const name = String(row[0] ?? '').trim();
    const exam = String(row[1] ?? '').trim();
    if (!name || !exam) continue;
    registerExam(exam);
    const scores = {};
    baseKeys.forEach((baseKey, j) => {
      const rawSub = rawSubjects[j];
      const v = toNum(row[2 + j]);
      recordClassSubjectMark(className, exam, baseKey, rawSub);
      if (v === null) { if (!(baseKey in scores)) scores[baseKey] = null; }
      else { if (scores[baseKey] == null || v > scores[baseKey]) scores[baseKey] = v; }
    });
    setScore(className, name, exam, scores);
  }
}
function parseHorizontal(rows, className) {
  const row0 = rows[0] || [], row1 = rows[1] || [];
  const groups = [];
  let cur = null;
  for (let c = 1; c < row1.length; c++) {
    const examName = String(row0[c] ?? '').trim();
    const subName = String(row1[c] ?? '').trim();
    if (examName) {
      if (cur && cur.subjects.length) groups.push(cur);
      cur = { exam: examName, subjects: [], start: c };
    }
    if (cur && subName) cur.subjects.push(subName);
  }
  if (cur && cur.subjects.length) groups.push(cur);
  if (!groups.length) return;
  groups.forEach(g => g.subjects.forEach(registerSubject));
  for (let r = 2; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const name = String(row[0] ?? '').trim();
    if (!name) continue;
    groups.forEach(g => {
      registerExam(g.exam);
      const scores = {};
      g.subjects.forEach((rawSub, i) => {
        const baseKey = normalizeSubjectKey(rawSub);
        const v = toNum(row[g.start + i]);
        recordClassSubjectMark(className, g.exam, baseKey, rawSub);
        if (v === null) { if (!(baseKey in scores)) scores[baseKey] = null; }
        else { if (scores[baseKey] == null || v > scores[baseKey]) scores[baseKey] = v; }
      });
      setScore(className, name, g.exam, scores);
    });
  }
}
const registerExam = e => { if (e && !state.examList.includes(e)) state.examList.push(e); };
function registerSubject(orig) {
  if (!orig) return;
  const b = normalizeSubjectKey(orig);
  if (!b) return;
  if (!state.subjectList.includes(b)) state.subjectList.push(b);
  if (!subjectFullMarks.has(b)) subjectFullMarks.set(b, new Set());
  if (!subjectOriginals.has(b)) subjectOriginals.set(b, new Set());
  subjectOriginals.get(b).add(orig);
  const fm = extractFullMark(orig);
  if (fm != null) subjectFullMarks.get(b).add(fm);
}
function registerClass(c) {
  if (!state.classList.includes(c)) state.classList.push(c);
  if (!state.classes[c]) state.classes[c] = { students: {} };
}
function setScore(cls, name, exam, scores) {
  registerClass(cls);
  const students = state.classes[cls].students;
  if (!students[name]) students[name] = {};
  if (!students[name][exam]) students[name][exam] = {};
  Object.assign(students[name][exam], scores);
}
function sortSubjects() {
  const idx = state.subjectList.findIndex(isTotal);
  if (idx > 0) { const [t] = state.subjectList.splice(idx, 1); state.subjectList.unshift(t); }
}
function getClassSubjects(cls) {
  if (!cls || !state.classes[cls]) return [];
  if (classSubCache.has(cls)) return classSubCache.get(cls);
  const students = state.classes[cls].students;
  const exams = state.examList;
  const result = state.subjectList.filter(sub => {
    for (const name in students) for (let i = 0; i < exams.length; i++) {
      const v = students[name]?.[exams[i]]?.[sub];
      if (typeof v === 'number') return true;
    }
    return false;
  });
  classSubCache.set(cls, result);
  return result;
}

/* ============ 统计计算 ============ */
function getStat(cls, exam, sub, mode) {
  const key = cls + '|' + exam + '|' + sub + '|' + mode;
  if (statCache.has(key)) return statCache.get(key);
  const students = state.classes[cls]?.students || {};
  const vals = [];
  for (const name in students) {
    const v = students[name]?.[exam]?.[sub];
    if (typeof v === 'number' && !Number.isNaN(v)) vals.push(v);
  }
  let res = null;
  if (vals.length) {
    if (mode === 'avg') res = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
    else if (mode === 'max') res = Math.max(...vals);
    else if (mode === 'min') res = Math.min(...vals);
  }
  statCache.set(key, res);
  return res;
}
function getStatStudents(cls, exam, sub, mode) {
  const students = state.classes[cls]?.students || {};
  const arr = [];
  for (const name in students) {
    const v = students[name]?.[exam]?.[sub];
    if (typeof v === 'number' && !Number.isNaN(v)) arr.push({ name, score: v });
  }
  if (!arr.length) return [];
  if (mode === 'max') { const mx = Math.max(...arr.map(x=>x.score)); return arr.filter(x=>x.score===mx).map(x=>({name:x.name,value:x.score+' 分',tone:'good'})); }
  if (mode === 'min') { const mn = Math.min(...arr.map(x=>x.score)); return arr.filter(x=>x.score===mn).map(x=>({name:x.name,value:x.score+' 分',tone:'bad'})); }
  return arr.map(x=>({name:x.name,value:x.score+' 分'}));
}
const getChecked = wrapId => Array.from(document.querySelectorAll('#' + wrapId + ' input[type="checkbox"]:checked')).map(i => i.value);
function computeRanks(values) {
  const sorted = values.filter(v=>v!==null&&!Number.isNaN(v)).sort((a,b)=>b-a);
  return values.map(v=>(v===null||Number.isNaN(v))?null:sorted.indexOf(v)+1);
}
function computeStreaks(scores) {
  const n = scores.length;
  const up = new Array(n).fill(false), down = new Array(n).fill(false);
  let cu = 0, cd = 0;
  for (let i = 0; i < n; i++) {
    if (i === 0 || scores[i] === null || scores[i-1] === null) { cu=0; cd=0; }
    else if (scores[i] > scores[i-1]) { cu++; cd=0; }
    else if (scores[i] < scores[i-1]) { cd++; cu=0; }
    else { cu=0; cd=0; }
    up[i] = cu >= 3; down[i] = cd >= 3;
  }
  return { up, down };
}
function getStudentTotal(stu, exam) {
  const t = stu[exam]?.['总分'];
  if (typeof t === 'number') return t;
  let sum = 0, has = false;
  for (const sub in stu[exam]) {
    if (isTotal(sub)) continue;
    const v = stu[exam][sub];
    if (typeof v === 'number') { sum += v; has = true; }
  }
  return has ? sum : null;
}
const hasAttended = (stu, exam) => {
  const scores = stu?.[exam];
  if (!scores) return false;
  for (const sub in scores) if (typeof scores[sub] === 'number') return true;
  return false;
};
function getStudentAbsence(stu, exams) {
  const flags = exams.map(ex=>hasAttended(stu,ex));
  const absent = exams.filter((_,i)=>!flags[i]);
  return { attendedCount: flags.filter(Boolean).length, total: exams.length, absent, flags };
}
function getAbsenteeInfo(cls) {
  const students = Object.keys(state.classes[cls]?.students || {});
  const exams = state.examList;
  if (!exams.length || !students.length) return null;
  const neverTested = [], multiAbsent = [], consecutiveAbsent = [];
  students.forEach(name => {
    const stu = state.classes[cls].students[name];
    const flags = exams.map(ex=>hasAttended(stu,ex));
    const attendCount = flags.filter(Boolean).length;
    if (attendCount === 0) { neverTested.push(name); return; }
    const segs = []; let cur = 0;
    flags.forEach(f => { if (!f) cur++; else { if (cur>0) segs.push(cur); cur=0; } });
    if (cur > 0) segs.push(cur);
    const maxSeg = segs.length ? Math.max(...segs) : 0;
    const absentCount = exams.length - attendCount;
    if (absentCount >= 2 || maxSeg >= 2) {
      multiAbsent.push({name,absentCount,maxSeg,total:exams.length});
      if (maxSeg >= 2) consecutiveAbsent.push({name,maxSeg,total:exams.length});
    }
  });
  return { neverTested, multiAbsent, consecutiveAbsent, totalStudents: students.length, totalExams: exams.length };
}

function destroyCharts() { chartInstances.forEach(c=>{try{c.destroy();}catch(e){}}); chartInstances = []; }
const addChart = c => { if (c) chartInstances.push(c); return c; };
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function createScoreLinePlugin() {
  return {
    id:'scoreLines',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea || !scales.y) return;
      const lines = [
        {v:readLine('lineControl'),color:'#9333ea',label:'控分线'},
        {v:readLine('linePublic'),color:'#dc2626',label:'公办线'},
        {v:readLine('linePrivate'),color:'#f97316',label:'民办线'},
        {v:readLine('lineEstimate'),color:'#3b82f6',label:'预估线'}
      ];
      ctx.save();
      const usedLabelY = [];
      lines.forEach(ln => {
        if (ln.v === null || ln.v <= 0) return;
        const py = scales.y.getPixelForValue(ln.v);
        if (py < chartArea.top || py > chartArea.bottom) return;
        ctx.setLineDash([7,4]);ctx.strokeStyle = ln.color;ctx.lineWidth = 2;
        ctx.beginPath();ctx.moveTo(chartArea.left,py);ctx.lineTo(chartArea.right,py);ctx.stroke();
        ctx.setLineDash([]);
        const text = ln.label + ' ' + ln.v;
        ctx.font = '700 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        const tw = ctx.measureText(text).width;
        const bw = tw + 12, bh = 17;
        let by = py - bh - 2;
        while (usedLabelY.some(y=>Math.abs(y-by)<bh+1)) by -= (bh+1);
        if (by < chartArea.top) by = py + 2;
        usedLabelY.push(by);
        const bx = chartArea.right - bw - 2;
        ctx.fillStyle = ln.color;roundRect(ctx,bx,by,bw,bh,4);ctx.fill();
        ctx.fillStyle = '#fff';ctx.textAlign = 'left';ctx.textBaseline = 'middle';
        ctx.fillText(text,bx+6,by+bh/2+.5);
      });
      ctx.restore();
    }
  };
}
function makeLineChart(canvasId, labels, datasets, showLines, opts) {
  const canvas = document.getElementById(canvasId);

  opts = opts || {};

function analysisPanel(sections) {

  let html = '<div class="analysis-panel"><div class="analysis-panel-title">综合分析总结<span class="tip">教学洞察</span></div>';

    if (!sec) return;

    const hasExtra = !!sec.extra;
    if (!hasItems && !hasParas && !hasExtra) return;

          ? ' data-tip-title="' + esc(it.label) + '" data-tip-items=\'' + JSON.stringify(it.tipItems).replace(/'/g,"&#39;") + '\''
          : '';

function drawF1b() {
  const cls = state.currentClass;
  const sub = $('rankSubject').value;
  const compareMode = $('rankCompare').value;
  const summaryWrap = $('rankSummary');
  const tableWrap = $('rankTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  const exams = state.examList;
  if (!sub || exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const last = exams[exams.length-1], first = exams[0], prev = exams[exams.length-2];
  const examA = compareMode === 'first' ? first : prev;
  const examB = last;
  const students = state.classes[cls].students;
  const names = Object.keys(students);
  const sA = {}, sB = {};
  names.forEach(n => {
    const a = students[n]?.[examA]?.[sub];
    const b = students[n]?.[examB]?.[sub];
    if (typeof a === 'number') sA[n] = a;
    if (typeof b === 'number') sB[n] = b;
  });
  const rA = computeRanks(names.map(n=>sA[n]??null));
  const rB = computeRanks(names.map(n=>sB[n]??null));
  const rows = names.map((n,i)=>({
    name:n, scoreA:sA[n]??null, scoreB:sB[n]??null,
    rankA:rA[i], rankB:rB[i], delta:(rA[i]!=null&&rB[i]!=null)?rA[i]-rB[i]:null
  })).filter(r=>r.scoreB!=null||r.scoreA!=null);
  let upCnt = 0, downCnt = 0, flatCnt = 0;
  const upNames = [], downNames = [];
  rows.forEach(r => {
    if (r.delta == null) return;
    if (r.delta > 0) { upCnt++; upNames.push({name:r.name,value:'+'+r.delta,tone:'good'}); }
    else if (r.delta < 0) { downCnt++; downNames.push({name:r.name,value:r.delta+'',tone:'bad'}); }
    else flatCnt++;
  });
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'对比区间',value:esc(examA)+' → '+esc(examB)},
    {label:'进步人数',value:upCnt+' 人',cls:upCnt?'font-up':'',tipItems:upNames},
    {label:'退步人数',value:downCnt+' 人',cls:downCnt?'font-down':'',tipItems:downNames},
    {label:'名次持平',value:flatCnt+' 人'}
  ];
  const valid = rows.filter(r=>r.delta!=null);
  const bestUp = [...valid].sort((a,b)=>b.delta-a.delta)[0];
  const bestDown = [...valid].sort((a,b)=>a.delta-b.delta)[0];
  const paras = [];

      '<div id="stabilityTable"></div>' +
    '</div>';
  $('stabilitySubject').addEventListener('change', drawF1c);

function drawF1c() {
  const cls = state.currentClass;
  const sub = $('stabilitySubject').value;
  const summaryWrap = $('stabilitySummary');
  const tableWrap = $('stabilityTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  const exams = state.examList;
  if (!sub || exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const students = state.classes[cls].students;
  const rows = [];
  for (const name in students) {
    const scores = [];
    exams.forEach(ex => {
      const v = students[name]?.[ex]?.[sub];
      if (typeof v === 'number') scores.push(v);
    });
    if (scores.length < 2) continue;
    const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
    const variance = scores.reduce((a,b)=>a+(b-avg)**2,0)/scores.length;
    const std = Math.round(Math.sqrt(variance)*10)/10;
    rows.push({name,scores,count:scores.length,avg:Math.round(avg*10)/10,std,range:Math.max(...scores)-Math.min(...scores)});
  }
  if (!rows.length) { tableWrap.innerHTML = '<div class="empty-hint">数据不足</div>'; return; }
  const stabCls = s => s<=5?'stability-good':s<=12?'stability-mid':'stability-poor';
  const stabLabel = s => s<=5?'非常稳定':s<=12?'较稳定':'波动较大';
  const avgStd = rows.reduce((a,r)=>a+r.std,0)/rows.length;
  const very = rows.filter(r=>r.std<=5);
  const mid = rows.filter(r=>r.std>5&&r.std<=12);
  const poor = rows.filter(r=>r.std>12);
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'学生数',value:rows.length+' 人'},
    {label:'标准差均值',value:avgStd.toFixed(1)},
    {label:'非常稳定',value:very.length+' 人',cls:very.length?'font-up':'',tipItems:very.map(r=>({name:r.name,value:'±'+r.std,tone:'good'}))},
    {label:'波动较大',value:poor.length+' 人',cls:poor.length?'font-down':'',tipItems:poor.map(r=>({name:r.name,value:'±'+r.std,tone:'bad'}))}
  ];
  const paras = [
    '班级标准差均值 <b class="hl">' + avgStd.toFixed(1) + '</b>，' + (avgStd<=5?'非常稳定。':avgStd<=12?'相对稳定。':'波动较大。'),
    '非常稳定 <b class="font-up">' + very.length + '</b> 人，较稳定 <b>' + mid.length + '</b> 人，波动较大 <b class="warn">' + poor.length + '</b> 人。'
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'稳定性综合统计',items,paras}]);
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'姓名',width:110,sticky:true,sortable:true,getValue:r=>r.name,render:r=>'<td style="font-weight:700">'+esc(r.name)+'</td>'},
    {label:'参考次数',width:90,sortable:true,getValue:r=>r.count,render:r=>'<td>'+r.count+'</td>'},
    {label:'平均分',width:90,sortable:true,getValue:r=>r.avg,render:r=>'<td>'+r.avg+'</td>'},
    {label:'标准差',width:90,sortable:true,getValue:r=>r.std,render:r=>'<td class="'+stabCls(r.std)+'">'+r.std+'</td>'},
    {label:'波动幅度',width:100,sortable:true,getValue:r=>r.range,render:r=>'<td>'+r.range+'</td>'},
    {label:'稳定性',width:100,sortable:true,getValue:r=>r.std,render:r=>'<td class="'+stabCls(r.std)+'">'+stabLabel(r.std)+'</td>'},
    {label:'成绩序列',width:300,sortable:false,render:r=>'<td style="font-size:.78rem;color:#475569">'+r.scores.join(' → ')+'</td>'}
  ];
  renderGridTable(cols, rows, 'stability', tableWrap, drawF1c);
}

function renderF2a(root) {
  const cls = state.currentClass;
  const exams = state.examList;
  const subs = getClassSubjects(cls).filter(s=>!isTotal(s));
  const students = Object.keys(state.classes[cls].students);
  root.innerHTML = '<div id="classSummary"></div>' +
    '<div class="card"><h3>各科目班级统计趋势</h3><div id="subjectChartWrap" class="chart-grid"></div></div>';

    {label:'当前班级',value:esc(cls)},
    {label:'考试次数',value:exams.length+' 次'},
    {label:'科目数',value:subs.length+' 科'},
    {label:'学生人数',value:students.length+' 人',tipItems:students.map(n=>({name:n,value:''}))}
  ];
  const paras = [];
  if (exams.length >= 2) {
    const last = exams[exams.length-1], prev = exams[exams.length-2];
    let upSubs = 0, downSubs = 0, bestUpSub = null, bestDownSub = null, bestSubAvg = null, worstSubAvg = null;
    subs.forEach(sub => {
      const lv = getStat(cls, last, sub, 'avg');
      const pv = getStat(cls, prev, sub, 'avg');
      if (lv != null) {
        if (!bestSubAvg || lv > bestSubAvg.v) bestSubAvg = {sub,v:lv};
        if (!worstSubAvg || lv < worstSubAvg.v) worstSubAvg = {sub,v:lv};
      }
      if (lv == null || pv == null) return;
      const d = Math.round((lv-pv)*10)/10;
      if (d > 0) upSubs++; else if (d < 0) downSubs++;
      if (!bestUpSub || d > bestUpSub.delta) bestUpSub = {sub,delta:d};
      if (!bestDownSub || d < bestDownSub.delta) bestDownSub = {sub,delta:d};
    });
    items.push(
      {label:'进步科目',value:upSubs+' 科',cls:upSubs?'font-up':''},
      {label:'退步科目',value:downSubs+' 科',cls:downSubs?'font-down':''}
    );
    if (bestSubAvg) paras.push('最强科目：<b class="hl">' + esc(bestSubAvg.sub) + '</b>（平均 ' + bestSubAvg.v + ' 分）。');
    if (worstSubAvg && bestSubAvg && worstSubAvg.sub !== bestSubAvg.sub) paras.push('薄弱科目：<b class="hl">' + esc(worstSubAvg.sub) + '</b>（平均 ' + worstSubAvg.v + ' 分）。');
    if (bestUpSub && bestUpSub.delta > 0) paras.push('平均提升最大：<b>' + esc(bestUpSub.sub) + '</b>，<b class="font-up">+' + bestUpSub.delta + '</b> 分。');
    if (bestDownSub && bestDownSub.delta < 0) paras.push('平均下降最大：<b>' + esc(bestDownSub.sub) + '</b>，<b class="font-down">' + bestDownSub.delta + '</b> 分。');
  }
  const absentee = getAbsenteeInfo(cls);
  const sections = [{title:'班级整体表现',items,paras}];
  if (absentee) sections.push({title:'缺考名单记录',extra:renderAbsentBlock(absentee)});
  $('classSummary').innerHTML = analysisPanel(sections);
  const wrap = $('subjectChartWrap');
  wrap.innerHTML = '';
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + '</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    wrap.appendChild(card);
    addChart(makeLineChart(id, exams, [
      {label:'平均分',data:exams.map(ex=>getStat(cls,ex,sub,'avg')),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.15)',tension:.4,fill:true,pointRadius:2,borderWidth:2},
      {label:'最高分',data:exams.map(ex=>getStat(cls,ex,sub,'max')),borderColor:'#22c55e',borderDash:[5,4],tension:.4,fill:false,pointRadius:2,borderWidth:2},
      {label:'最低分',data:exams.map(ex=>getStat(cls,ex,sub,'min')),borderColor:'#ef4444',borderDash:[5,4],tension:.4,fill:false,pointRadius:2,borderWidth:2}
    ], isTotal(sub)));
  });
  setTimeout(bindHoverTips, 10);
}

function drawF2b() {
  const wrap = $('tripleSubjectWrap');

  wrap.innerHTML = '';
  summaryWrap.innerHTML = '';
  const mode = $('tripleMode').value;
  const classes = getChecked('tripleClassWrap');
  const exams = state.examList;
  if (!classes.length) { wrap.innerHTML = '<div class="empty-hint">请选择至少一个班级</div>'; return; }
  const subs = state.subjectList.filter(sub => classes.some(c=>exams.some(e=>getStat(c,e,sub,mode)!=null)));
  if (!subs.length) { wrap.innerHTML = '<div class="empty-hint">暂无数据</div>'; return; }
  const last = exams[exams.length-1];
  const classScores = {};
  classes.forEach(cls => classScores[cls] = {total:0,count:0});
  subs.forEach(sub => classes.forEach(cls => {
    const v = getStat(cls, last, sub, mode);
    if (v != null) { classScores[cls].total += v; classScores[cls].count++; }
  }));
  const ranking = Object.entries(classScores).filter(([_,v])=>v.count>0)
    .map(([cls,v])=>({cls,avg:v.total/v.count})).sort((a,b)=>b.avg-a.avg);
  const items = [
    {label:'参与班级',value:classes.length+' 个'},
    {label:'科目数',value:subs.length+' 科'},
    {label:'统计维度',value:modeLabel(mode)}
  ];
  if (ranking.length) {
    items.push({label:'领先班级',value:esc(ranking[0].cls),cls:'font-up'});
    items.push({label:'末位班级',value:esc(ranking[ranking.length-1].cls),cls:'font-down'});
  }
  const paras = [];
  if (ranking.length >= 2) {
    const gap = (ranking[0].avg - ranking[ranking.length-1].avg).toFixed(1);
    paras.push('<b class="hl">' + esc(ranking[0].cls) + '</b> 领先，<b class="hl">' + esc(ranking[ranking.length-1].cls) + '</b> 落后，差距约 <b>' + gap + '</b> 分。');
  }
  summaryWrap.innerHTML = analysisPanel([{title:'多班级综合对比',items,paras}]);
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card triple-chart-card';
    const id = uid();
    const prevExam = exams.length >= 2 ? exams[exams.length-2] : null;
    const list = classes.map(cls => {
      const s = getStat(cls, last, sub, mode);
      const p = prevExam ? getStat(cls, prevExam, sub, mode) : null;
      return {cls,s,delta:(s!=null&&p!=null)?Math.round((s-p)*10)/10:null};
    });
    const valid = list.filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
    const best = valid.length ? valid[0].cls+'( '+valid[0].s+')' : '—';
    const worst = valid.length ? valid[valid.length-1].cls+'('+valid[valid.length-1].s+')' : '—';
    const withDelta = list.filter(x=>x.delta!=null);
    let bestUp = '—', worstDown = '—';
    if (withDelta.length) {
      const a = [...withDelta].sort((x,y)=>y.delta-x.delta)[0];
      const b = [...withDelta].sort((x,y)=>x.delta-y.delta)[0];
      bestUp = '<span class="text-green">' + esc(a.cls) + ' ↑+' + a.delta + '</span>';
      worstDown = '<span class="text-red">' + esc(b.cls) + ' ↓' + b.delta + '</span>';
    }
    const fmList = getSubjectFullMarkList(sub);
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + '｜' + modeLabel(mode) + '对比</h4>' +
      '<div class="chart-box"><canvas id="' + id + '"></canvas></div>' +
      '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:#f8fbff;border:1px dashed rgba(59,130,246,.25);font-size:.78rem;line-height:1.75">' +
      '<div style="font-weight:800;color:var(--primary-darker);margin-bottom:4px">' + esc(sub) + '｜' + modeLabel(mode) + '【' + esc(last) + '】</div>' +
      '<div>最优：' + esc(best) + ' &nbsp;|&nbsp; 最差：' + esc(worst) + '</div>' +
      '<div>进步最大：' + bestUp + ' &nbsp;|&nbsp; 退步最大：' + worstDown + '</div>' +
      (fmList.length ? '<div>科目满分：' + fmList.join(' / ') + '</div>' : '') +
      '</div>';
    wrap.appendChild(card);
    const datasets = classes.map((cls,i) => {
      const c = colorPool[i % colorPool.length];
      return {label:cls,data:exams.map(e=>getStat(cls,e,sub,mode)),borderColor:c.border,backgroundColor:c.bg,tension:.4,fill:false,pointRadius:3,borderWidth:2};
    });
    addChart(makeLineChart(id, exams, datasets, isTotal(sub)));
  });

        y:{beginAtZero:false,grace:'12%',ticks:{font:{size:12.5}}}
      }
    },
    plugins: isTotal(sub) ? [createScoreLinePlugin()] : []
  }));
  const last = exams[exams.length-1];
  const prev = exams.length >= 2 ? exams[exams.length-2] : null;
  const list = classes.map(cls => {
    const s = getStat(cls, last, sub, mode);
    const p = prev ? getStat(cls, prev, sub, mode) : null;
    return {cls,s,delta:(s!=null&&p!=null)?Math.round((s-p)*10)/10:null};
  });
  const valid = list.filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
  if (valid.length) {
    const fmList = getSubjectFullMarkList(sub);
    const items = [
      {label:'科目',value:esc(sub)},
      {label:'统计维度',value:modeLabel(mode)},
      {label:'有效班级',value:valid.length+' 个'},
      {label:'领先班级',value:esc(valid[0].cls),cls:'font-up'},
      {label:'末位班级',value:esc(valid[valid.length-1].cls),cls:'font-down'}
    ];
    if (fmList.length) items.push({label:'科目满分',value:fmList.join('/')});
    summaryWrap.innerHTML = analysisPanel([{title:'单科综合对比',items,paras:[]}]);
  }
}

function drawF3a() {
  const cls = state.currentClass;
  const sub = $('clsSub').value;
  const summaryWrap = $('singleClassSummary');
  const tableWrap = $('classTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  if (!sub) return;
  const students = state.classes[cls].students;
  const exams = state.examList;
  const last = exams[exams.length-1];
  const scores = [];
  for (const name in students) {
    const v = students[name]?.[last]?.[sub];
    if (typeof v === 'number') scores.push(v);
  }
  if (!scores.length) { tableWrap.innerHTML = '<div class="empty-hint">该科目暂无有效成绩</div>'; return; }
  scores.sort((a,b)=>b-a);
  const max = scores[0], min = scores[scores.length-1];
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  const total = scores.length;
  const t1 = Math.ceil(total/3), t2 = Math.ceil((total-t1)/2), t3 = total-t1-t2;
  const fullMark = getClassSubjectMark(cls, last, sub) || getSubjectFullMark(sub);
  const allStudents = [];
  for (const name in students) {
    const v = students[name]?.[last]?.[sub];
    if (typeof v === 'number') allStudents.push({name,value:v+' 分'});
  }
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'参考人数',value:total+' 人',tipItems:allStudents},
    {label:'班级平均',value:avg.toFixed(1)},
    {label:'最高分',value:max,tipItems:getStatStudents(cls,last,sub,'max')},
    {label:'最低分',value:min,tipItems:getStatStudents(cls,last,sub,'min')}
  ];
  if (fullMark != null) items.push({label:'科目满分',value:fullMark});
  if (exams.length >= 2) {
    const prev = exams[exams.length-2];
    const upNames = [], downNames = [];
    let upCnt = 0, downCnt = 0;
    const prevScores = [];
    for (const name in students) {
      const a = students[name]?.[prev]?.[sub];
      const b = students[name]?.[last]?.[sub];
      if (typeof a === 'number' && typeof b === 'number') {
        if (b > a) { upCnt++; upNames.push({name,value:'+'+(Math.round((b-a)*10)/10),tone:'good'}); }
        else if (b < a) { downCnt++; downNames.push({name,value:(Math.round((b-a)*10)/10)+'',tone:'bad'}); }
      }
      if (typeof a === 'number') prevScores.push(a);
    }
    if (prevScores.length) {
      const prevAvg = prevScores.reduce((a,b)=>a+b,0)/prevScores.length;
      const d = Math.round((avg-prevAvg)*10)/10;
      items.push({label:'平均变化',value:fmtDelta(d),cls:d>0?'font-up':d<0?'font-down':'font-flat'});
    }
    items.push({label:'进步人数',value:upCnt+' 人',cls:upCnt?'font-up':'',tipItems:upNames});
    items.push({label:'退步人数',value:downCnt+' 人',cls:downCnt?'font-down':'',tipItems:downNames});
  }
  const paras = [
    '末次考试平均 <b class="hl">' + avg.toFixed(1) + '</b> 分，最高 <b>' + max + '</b>，最低 <b>' + min + '</b>。',
    '分数分布：前 1/3 段 <b>' + t1 + '</b> 人，中间段 <b>' + t2 + '</b> 人，后 1/3 段 <b>' + Math.max(t3,0) + '</b> 人。'
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'单科全班综合表现',items,paras}]);
  const rows = Object.keys(students).map(name => {
    const scores = exams.map(ex => {
      const v = students[name]?.[ex]?.[sub];
      return typeof v === 'number' ? v : null;
    });
    const valid = scores.filter(s=>s!==null);
    return {name,scores,last:valid.length?valid[valid.length-1]:-Infinity};
  });
  rows.sort((a,b)=>b.last-a.last);
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'姓名',width:100,sticky:true,sortable:true,getValue:r=>r.name,render:r=>'<td style="font-weight:700">'+esc(r.name)+'</td>'}
  ];
  exams.forEach((ex,i) => {
    cols.push({
      label:ex,width:110,sortable:true,
      getValue:r=>r.scores[i]==null?-Infinity:r.scores[i],
      render:r => {
        const s = r.scores[i];
        const prevS = i > 0 ? r.scores[i-1] : null;
        const { up, down } = computeStreaks(r.scores);
        let cellCls = '';
        if (up[i]) cellCls = 'cell-streak-up';
        else if (down[i]) cellCls = 'cell-streak-down';
        let diffHtml = '';
        if (i > 0 && s !== null && prevS !== null) {
          const d = Math.round((s - prevS) * 10) / 10;
          diffHtml = d > 0 ? '<span class="score-diff diff-up">↑+' + d + '</span>'
            : d < 0 ? '<span class="score-diff diff-down">↓' + d + '</span>'
            : '<span class="score-diff diff-flat">—0</span>';
        }
        const allVals = rows.map(rr => rr.scores[i]).filter(v => v != null);
        const sortedVals = [...allVals].sort((a,b)=>b-a);
        const rank = s != null ? sortedVals.indexOf(s) + 1 : null;
        return '<td class="' + cellCls + '"><span class="score-main">' + (s != null ? s : '—') + '</span>' +
          diffHtml + (rank ? '<span class="score-diff">(排名' + rank + ')</span>' : '') + '</td>';
      }
    });
  });
  renderGridTable(cols, rows, 'classTable', tableWrap, drawF3a);
}

      const fullMark = getClassSubjectMark(cls, exam, sub) || getSubjectFullMark(sub);
      const students = state.classes[cls]?.students || {};
      const listByLevel = {};
      SEG_LEVELS.forEach(lv => listByLevel[lv.key] = []);
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) listByLevel[k].push({name,value:v+' 分'});
        }
      }
      const total = SEG_LEVELS.reduce((a,lv)=>a+listByLevel[lv.key].length,0);
      if (!total) return;
      rows.push({sub,cls,fullMark,total,listByLevel});
    });
  });
  if (!rows.length) { tableWrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0;
  const sumCounts = {}; SEG_LEVELS.forEach(lv => sumCounts[lv.key] = 0);
  const nameList = {}; SEG_LEVELS.forEach(lv => nameList[lv.key] = []);
  rows.forEach(r => {
    totalRef += r.total;
    SEG_LEVELS.forEach(lv => {
      sumCounts[lv.key] += r.listByLevel[lv.key].length;
      r.listByLevel[lv.key].forEach(x => nameList[lv.key].push({name:r.cls+' · '+x.name,value:x.value}));
    });
  });
  const items = [
    {label:'统计考试',value:esc(exam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'参考人次',value:totalRef+' 次'}
  ];
  SEG_LEVELS.forEach(lv => {
    const c = sumCounts[lv.key];
    const ratio = totalRef ? c/totalRef : 0;
    items.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      value:mode === 'ratio' ? pct(ratio) : c+' 人次',
      cls: lv.key === 's' || lv.key === 'a' ? 'font-up' : lv.key === 'd' ? 'font-down' : '',
      tipItems:nameList[lv.key]
    });
  });
  const rateTop = totalRef ? (sumCounts.s + sumCounts.a)/totalRef : 0;
  const rateWeak = totalRef ? sumCounts.d/totalRef : 0;
  const paras = [
    '卓越+优秀率 <b class="hl">' + pct(rateTop) + '</b>，' + (rateTop >= 0.5 ? '整体水平较高。' : rateTop >= 0.25 ? '仍有提升空间。' : '建议加强尖子生培养。'),
    '待提高占比 <b class="warn">' + pct(rateWeak) + '</b>，' + (rateWeak >= 0.3 ? '建议重点关注基础薄弱学生。' : rateWeak >= 0.15 ? '可针对性补弱。' : '整体达标情况良好。')
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'分数段综合统计',items,paras}]);
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + ' 分数段分布</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    chartWrap.appendChild(card);
    const labels = classes.slice();
    const countsByLevel = {}; SEG_LEVELS.forEach(lv => countsByLevel[lv.key] = []);
    classes.forEach(cls => {
      const fullMark = getClassSubjectMark(cls, exam, sub) || getSubjectFullMark(sub);
      const students = state.classes[cls]?.students || {};
      const counts = {}; SEG_LEVELS.forEach(lv => counts[lv.key] = 0);
      let total = 0;
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) counts[k]++;
          total++;
        }
      }
      SEG_LEVELS.forEach(lv => countsByLevel[lv.key].push(mode === 'ratio' ? (total ? Math.round(counts[lv.key]/total*1000)/10 : 0) : counts[lv.key]));
    });
    const colors = {
      s:{bg:'rgba(22,163,74,.8)',border:'#166534'},
      a:{bg:'rgba(34,197,94,.75)',border:'#16a34a'},
      b:{bg:'rgba(59,130,246,.75)',border:'#2563eb'},
      c:{bg:'rgba(245,158,11,.75)',border:'#d97706'},
      d:{bg:'rgba(239,68,68,.75)',border:'#dc2626'}
    };
    const datasets = SEG_LEVELS.map(lv => ({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      data:countsByLevel[lv.key],
      backgroundColor:colors[lv.key].bg,
      borderColor:colors[lv.key].border,
      borderWidth:1
    }));
    addChart(makeBarChart(id, labels, datasets));
  });
  const isRatio = mode === 'ratio';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:96,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject">'+esc(r.sub)+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'满分',width:80,sortable:true,getValue:r=>r.fullMark,render:r=>'<td>'+r.fullMark+'</td>'},
    {label:'参考人数',width:100,sortable:true,getValue:r=>r.total,render:r=>'<td><span class="count-cell" data-tip-title="参考学生名单" data-tip-items=\''+JSON.stringify(SEG_LEVELS.flatMap(lv=>r.listByLevel[lv.key])).replace(/'/g,"&#39;")+'\'>'+r.total+'</span></td>'}
  ];
  SEG_LEVELS.forEach(lv => {
    cols.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',width:120,sortable:true,
      getValue:r=>r.listByLevel[lv.key].length,
      render:r=>{
        const c = r.listByLevel[lv.key].length;
        const val = isRatio ? pct(r.total?c/r.total:0) : c+' 人';
        return '<td><span class="seg-badge '+lv.cls+' count-cell" data-tip-title="'+esc(lv.label)+'（'+c+' 人）" data-tip-items=\''+JSON.stringify(r.listByLevel[lv.key]).replace(/'/g,"&#39;")+'\'>'+val+'</span></td>';
      }
    });
  });
  renderGridTable(cols, rows, 'seg', tableWrap, drawF4b);
}

function drawF5() {
  const wrap = $('dataTable');
  const summaryWrap = $('dataTableSummary');
  const mode = $('tableMode').value;
  const classes = getChecked('tableClassWrap');
  const subs = getChecked('tableSubjectWrap');
  const exams = state.examList;
  summaryWrap.innerHTML = '';
  if (!classes.length || !subs.length || !exams.length) { wrap.innerHTML = '<div class="empty-hint">请勾选至少一个班级和至少一个科目</div>'; return; }
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const scores = exams.map(e=>getStat(cls,e,sub,mode));
      if (scores.every(s=>s===null)) return;
      rows.push({sub,cls,scores});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  const last = exams[exams.length-1];
  const prev = exams.length >= 2 ? exams[exams.length-2] : null;
  const cells = [];
  subs.forEach(sub => classes.forEach(cls => {
    const lv = getStat(cls, last, sub, mode);
    if (lv == null) return;
    const pv = prev ? getStat(cls, prev, sub, mode) : null;
    cells.push({sub,cls,last:lv,delta:(lv!=null&&pv!=null)?Math.round((lv-pv)*10)/10:null});
  }));
  const withDelta = cells.filter(c=>c.delta!=null);
  const upCells = withDelta.filter(c=>c.delta>0);
  const downCells = withDelta.filter(c=>c.delta<0);
  const topCell = [...cells].sort((a,b)=>b.last-a.last)[0];
  const bottomCell = [...cells].sort((a,b)=>a.last-b.last)[0];
  const items = [
    {label:'统计维度',value:modeLabel(mode)},
    {label:'统计组合',value:cells.length+' 项'},
    {label:'进步项',value:upCells.length+' 项',cls:upCells.length?'font-up':''},
    {label:'退步项',value:downCells.length+' 项',cls:downCells.length?'font-down':''}
  ];
  if (topCell) items.push({label:'最高项',value:esc(topCell.cls)+' · '+esc(topCell.sub),cls:'font-up'});
  if (bottomCell) items.push({label:'最低项',value:esc(bottomCell.cls)+' · '+esc(bottomCell.sub),cls:'font-down'});
  const paras = [];
  if (topCell) paras.push('最高「' + modeLabel(mode) + '」为 <b class="hl">' + esc(topCell.cls) + ' · ' + esc(topCell.sub) + '</b>（' + topCell.last + ' 分）。');
  if (bottomCell) paras.push('最低项为 <b class="hl">' + esc(bottomCell.cls) + ' · ' + esc(bottomCell.sub) + '</b>（' + bottomCell.last + ' 分）。');
  summaryWrap.innerHTML = analysisPanel([{title:'明细数据综合对比',items,paras}]);
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:96,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject">'+esc(r.sub)+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'}
  ];
  exams.forEach((ex,i) => {
    cols.push({
      label:ex,width:120,sortable:true,
      getValue:r=>r.scores[i]==null?-Infinity:r.scores[i],
      render:r=>{
        const val = r.scores[i];
        const { up, down } = computeStreaks(r.scores);
        let cellCls = '';
        if (up[i]) cellCls = 'cell-streak-up';
        else if (down[i]) cellCls = 'cell-streak-down';
        let diffHtml = '';
        if (i > 0 && val !== null && r.scores[i-1] !== null) {
          const d = Math.round((val - r.scores[i-1]) * 10) / 10;
          diffHtml = d > 0 ? '<span class="score-diff diff-up">↑ +' + d + '</span>'
            : d < 0 ? '<span class="score-diff diff-down">↓ ' + d + '</span>'
            : '<span class="score-diff diff-flat">— 0</span>';
        }
        const allVals = rows.map(rr=>rr.scores[i]).filter(v=>v!=null);
        const sortedVals = [...allVals].sort((a,b)=>b-a);
        const rank = val != null ? sortedVals.indexOf(val) + 1 : null;
        return '<td class="' + cellCls + '"><span class="score-main">' + (val != null ? val : '—') + '</span>' +
          diffHtml + (rank ? '<span class="score-diff">(排名' + rank + ')</span>' : '') + '</td>';
      }
    });
  });
  renderGridTable(cols, rows, 'detail', wrap, drawF5);
}

function drawF6() {
  const wrap = $('rateTable');
  const summaryWrap = $('rateSummary');
  const classes = getChecked('rateClassWrap');
  const subs = getChecked('rateSubjectWrap');
  const exams = state.examList;
  summaryWrap.innerHTML = '';
  if (!classes.length || !subs.length || !exams.length) { wrap.innerHTML = '<div class="empty-hint">请先勾选科目和班级</div>'; return; }
  const examIdx = parseInt($('rateExam').value, 10);
  if (Number.isNaN(examIdx)) { wrap.innerHTML = '<div class="empty-hint">暂无可选考试</div>'; return; }
  const curExam = exams[examIdx];
  const prevExam = examIdx > 0 ? exams[examIdx-1] : null;
  const minPct = getRateMin(), stdPct = getRateStd();
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const students = state.classes[cls]?.students || {};
      const globalFm = getSubjectFullMark(sub);
      const curFm = getClassSubjectMark(cls, curExam, sub) || globalFm;
      if (curFm == null) return;
      const minLineCur = Math.round(curFm * minPct * 10) / 10;
      const stdLineCur = Math.round(curFm * stdPct * 10) / 10;
      const scores = [], minPassList = [], stdPassList = [];
      for (const name in students) {
        const v = students[name]?.[curExam]?.[sub];
        if (typeof v === 'number') {
          scores.push(v);
          if (v >= minLineCur) minPassList.push({name,value:v+' 分'});
          if (v >= stdLineCur) stdPassList.push({name,value:v+' 分'});
        }
      }
      if (!scores.length) return;
      const total = scores.length;
      const minPass = minPassList.length;
      const stdPass = stdPassList.length;
      let prevMinRate = null, prevStdRate = null, prevTotal = 0, prevFm = null;
      if (prevExam) {
        prevFm = getClassSubjectMark(cls, prevExam, sub) || globalFm;
        const prevMinLine = prevFm != null ? Math.round(prevFm * minPct * 10) / 10 : null;
        const prevStdLine = prevFm != null ? Math.round(prevFm * stdPct * 10) / 10 : null;
        const ps = [];
        for (const name in students) {
          const v = students[name]?.[prevExam]?.[sub];
          if (typeof v === 'number') ps.push(v);
        }
        if (ps.length && prevMinLine != null) {
          prevTotal = ps.length;
          prevMinRate = ps.filter(s=>s>=prevMinLine).length / ps.length;
          prevStdRate = ps.filter(s=>s>=prevStdLine).length / ps.length;
        }
      }
      rows.push({sub,cls,fullMark:curFm,minLine:minLineCur,stdLine:stdLineCur,total,minPass,stdPass,minPassList,stdPassList,
        minRate:minPass/total,stdRate:stdPass/total,prevMinRate,prevStdRate,prevTotal,prevFullMark:prevFm});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0, totalMinPass = 0, totalStdPass = 0;
  const allMinPass = [], allStdPass = [];
  rows.forEach(r => {
    totalRef += r.total; totalMinPass += r.minPass; totalStdPass += r.stdPass;
    r.minPassList.forEach(x => allMinPass.push({name:r.cls+' · '+x.name,value:x.value}));
    r.stdPassList.forEach(x => allStdPass.push({name:r.cls+' · '+x.name,value:x.value}));
  });
  const avgMin = totalRef ? totalMinPass/totalRef : 0;
  const avgStd = totalRef ? totalStdPass/totalRef : 0;
  const items = [
    {label:'统计考试',value:esc(curExam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'最低达标率均值',value:pct(avgMin),tipItems:allMinPass},
    {label:'标准达标率均值',value:pct(avgStd),tipItems:allStdPass}
  ];
  const paras = [];
  if (avgMin >= 0.8) paras.push('整体最低达标率表现良好。');
  else if (avgMin >= 0.5) paras.push('整体最低达标率处于中等水平。');
  else paras.push('整体最低达标率偏低，建议加强基础教学。');
  const fmSet = new Set(rows.map(r=>r.fullMark));
  if (fmSet.size > 1) paras.push('所选范围存在多种科目满分，已按各班实际满分独立计算。');
  summaryWrap.innerHTML = analysisPanel([{title:'达标率综合统计',items,paras}]);
  const rateCls = r => r>=0.8?'rate-good':r>=0.5?'rate-mid':'rate-low';
  const deltaHtml = (cur,prev) => {
    if (prev == null) return '<span class="rate-delta flat">—</span>';
    const d = (cur-prev)*100;
    if (Math.abs(d) < 0.05) return '<span class="rate-delta flat">0.0pp</span>';
    return '<span class="rate-delta ' + (d>0?'up':'down') + '">' + (d>0?'+':'') + d.toFixed(1) + 'pp</span>';
  };
  const fmLabelHtml = (curFm,prevFm) => (prevFm == null || Math.abs(prevFm-curFm) < 0.001) ? String(curFm) : curFm + ' <span class="fullmark-changed">(上次 ' + prevFm + ')</span>';
  const minPctText = Math.round(minPct*100) + '%';
  const stdPctText = Math.round(stdPct*100) + '%';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:96,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject">'+esc(r.sub)+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'参考人数',width:90,sortable:true,getValue:r=>r.total,render:r=>'<td>'+r.total+'</td>'},

/* ============ 文件上传 ============ */
function readOneFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        wb.SheetNames.forEach(sheetName => {
          const className = String(sheetName).trim();
          if (!className) return;
          const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1,defval:null});
          parseSheet(json, className);
        });
        resolve();
      } catch (err) { reject(new Error('【' + file.name + '】解析失败：' + err.message)); }
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsArrayBuffer(file);
  });
}
async function handleFileUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  if (typeof XLSX === 'undefined') { alert('Excel 解析库尚未加载完成，请刷新页面后重试。'); return; }
  showLoading('正在读取文件，请稍候...');
  $('uploadBtn').disabled = true;
  try {
    resetAll();
    let success = 0;
    for (const f of files) {
      const ext = f.name.split('.').pop().toLowerCase();
      if (ext !== 'xlsx' && ext !== 'xls') { alert('不支持的文件格式：' + f.name + '（仅支持 .xlsx / .xls）'); continue; }
      await readOneFile(f);
      success++;
    }
    if (!success) { alert('未成功读取任何文件，请检查文件格式。'); return; }
    sortSubjects();
    initUIAfterLoad();
  } catch (err) {
    console.error(err);
    alert('文件读取异常：' + err.message);
  } finally {
    event.target.value = '';
    $('uploadBtn').disabled = false;
    hideLoading();
  }
}
function resetAll() {
  if (p4Observer) { p4Observer.disconnect(); p4Observer = null; }
